<!DOCTYPE html>
<html>
<head>
    <title>ZIP PDF to Excel</title>
</head>
<body>

<h1>Upload ZIP File</h1>

<form action="/upload" method="POST" enctype="multipart/form-data">
    <input type="file" name="zipfile" accept=".zip" required>
    <button type="submit">Upload</button>
</form>

</body>
</html>
